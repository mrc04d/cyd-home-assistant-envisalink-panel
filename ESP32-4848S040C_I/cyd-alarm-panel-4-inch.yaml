script:
  - id: fx_buzzer
    parameters:
      duration_ms: int
    then:
      # 4" board has no sounder - intentional no-op
      - logger.log:
          format: "fx_buzzer(%d) ignored (no buzzer)"
          args: ['duration_ms']
  - id: fx_alarm_visual
    parameters:
      active: bool
    then:
      # Visual-only: status label blinks handled by core interval reading
      # alarm_state; nothing extra needed here today.
      - logger.log:
          format: "fx_alarm_visual(%d)"
          args: ['active']
