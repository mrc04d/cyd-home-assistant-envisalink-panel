# =============================================================================
# Guition ESP32-4848S040C_I - Alarm Panel for Envisalink
# =============================================================================

substitutions:
  device_name: guition-alarm-panel
  friendly_name: "Guition Alarm Panel"
  alarm_entity: "alarm_control_panel.home_alarm_partition_1"
  timezone: "Etc/UTC"

packages:
  core: !include ../common/alarm-core.yaml

# =============================================================================
# WiFi Configuration
# =============================================================================
# Shared WiFi/AP configuration lives in common/alarm-core.yaml.
wifi:
  # OPTIONAL STATIC IP - device-local opt-in only (never enable in core):
  # manual_ip:
  #   static_ip: 192.168.1.70
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    build_flags:
      - "-DARDUINO_USB_CDC_ON_BOOT=0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "${friendly_name} Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    id: wifi_signal_db
    update_interval: 10s

display:
  - platform: st7701s
    id: my_display
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    on_touch:
      - script.execute: screen_wake
      - lambda: id(last_touch) = millis();
      - light.turn_on:
          id: backlight
          brightness: 1.0
          transition_length: 300ms

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 25%

  pages:
    - id: wifi_setup_page
      bg_color: ${bg_dark}
      widgets:
        - obj:
            align: TOP_MID
            width: 480
            height: 80
            bg_color: ${card_bg}
            radius: 0
            border_width: 0

        - label:
            align: TOP_MID
            y: 25
            text: "WiFi Setup Required"
            text_color: 0xFF6600
            text_font: montserrat_36

        - obj:
            align: CENTER
            y: 20
            width: 450
            height: 300
            bg_color: ${card_bg}
            radius: 18
            border_width: 3
            border_color: 0xFF6600

        - label:
            align: CENTER
            y: -60
            text: "1. Connect to WiFi network:"
            text_color: ${text_dim}
            text_font: montserrat_22

        - label:
            id: ap_ssid_label
            align: CENTER
            y: -16
            text: "${friendly_name} Setup"
            text_color: ${ok_green}
            text_font: montserrat_28

        - label:
            align: CENTER
            y: 36
            text: "2. Password: configme123"
            text_color: ${text_dim}
            text_font: montserrat_22

        - label:
            align: CENTER
            y: 90
            text: "3. Configure your WiFi"
            text_color: ${text_dim}
            text_font: montserrat_22

        - label:
            align: CENTER
            y: 136
            text: "in the portal that opens"
            text_color: ${text_dim}
            text_font: montserrat_22

        - label:
            align: BOTTOM_MID
            y: -30
            text: "Waiting for connection..."
            text_color: ${button_grey}
            text_font: montserrat_22

    - id: main_page
      bg_color: ${bg_dark}
      widgets:
        - obj:
            align: TOP_MID
            width: 480
            height: 64
            bg_color: ${card_bg}
            radius: 0
            border_width: 0

        - label:
            id: time_label
            text: "00:00"
            align: TOP_LEFT
            x: 18
            y: 20
            text_color: ${text_dim}
            text_font: montserrat_28

        - obj:
            id: api_badge
            align: TOP_RIGHT
            x: -92
            y: 28
            width: 12
            height: 12
            radius: 6
            bg_color: ${button_grey}
            border_width: 0

        - obj:
            id: wifi_bar1
            align: TOP_RIGHT
            x: -68
            y: 40
            width: 9
            height: 9
            radius: 2
            bg_color: ${button_grey}
            border_width: 0

        - obj:
            id: wifi_bar2
            align: TOP_RIGHT
            x: -54
            y: 34
            width: 9
            height: 15
            radius: 2
            bg_color: ${button_grey}
            border_width: 0

        - obj:
            id: wifi_bar3
            align: TOP_RIGHT
            x: -40
            y: 28
            width: 9
            height: 21
            radius: 2
            bg_color: ${button_grey}
            border_width: 0

        - obj:
            id: wifi_bar4
            align: TOP_RIGHT
            x: -26
            y: 22
            width: 9
            height: 27
            radius: 2
            bg_color: ${button_grey}
            border_width: 0

        - obj:
            id: status_card
            align: CENTER
            y: -30
            width: 420
            height: 180
            bg_color: ${card_bg}
            radius: 24
            border_width: 3
            border_color: ${border_idle}

        - label:
            id: status_label
            text: "Loading..."
            align: CENTER
            y: -30
            text_color: 0xFFFFFF
            text_font: montserrat_48

        - button:
            id: stay_btn
            align: BOTTOM_LEFT
            x: 30
            y: -30
            width: 195
            height: 110
            radius: 18
            bg_color: ${button_blue}
            border_width: 0
            pressed:
              bg_color: ${button_blue_pressed}
            on_press:
              - logger.log: "STAY button pressed"
              - script.execute: mark_arming_started
              - script.execute: start_arm_watchdog
              - homeassistant.action:
                  action: alarm_control_panel.alarm_arm_home
                  data:
                    entity_id: ${alarm_entity}
            widgets:
              - label:
                  align: CENTER
                  text: "STAY"
                  text_color: 0xFFFFFF
                  text_font: montserrat_36

        - button:
            id: away_btn
            align: BOTTOM_RIGHT
            x: -30
            y: -30
            width: 195
            height: 110
            radius: 18
            bg_color: ${button_blue}
            border_width: 0
            pressed:
              bg_color: ${button_blue_pressed}
            on_press:
              - logger.log: "AWAY button pressed"
              - script.execute: mark_arming_started
              - script.execute: start_arm_watchdog
              - homeassistant.action:
                  action: alarm_control_panel.alarm_arm_away
                  data:
                    entity_id: ${alarm_entity}
            widgets:
              - label:
                  align: CENTER
                  text: "AWAY"
                  text_color: 0xFFFFFF
                  text_font: montserrat_36

        - button:
            id: cancel_btn
            align: BOTTOM_MID
            y: -30
            width: 300
            height: 110
            radius: 18
            bg_color: ${button_blue}
            border_width: 0
            pressed:
              bg_color: ${button_blue_pressed}
            on_press:
              - script.execute: try_grace_cancel
            widgets:
              - label:
                  align: CENTER
                  text: "CANCEL"
                  text_color: 0xFFFFFF
                  text_font: montserrat_36

        - button:
            id: disarm_btn
            align: BOTTOM_MID
            y: -30
            width: 300
            height: 110
            radius: 18
            bg_color: ${button_blue}
            border_width: 0
            pressed:
              bg_color: ${button_blue_pressed}
            on_press:
              - logger.log: "DISARM button pressed"
              - script.execute: open_numpad
            widgets:
              - label:
                  align: CENTER
                  text: "DISARM"
                  text_color: 0xFFFFFF
                  text_font: montserrat_36

    - id: numpad_page
      bg_color: ${bg_dark}
      widgets:
        - obj:
            align: TOP_MID
            y: 18
            width: 444
            height: 92
            bg_color: ${card_bg}
            radius: 18
            border_width: 3
            border_color: ${border_idle}

        - label:
            id: pin_display
            align: TOP_MID
            y: 30
            text: "ENTER CODE"
            text_align: CENTER
            text_color: ${text_dim}
            text_font: montserrat_22

        - label:
            id: pin_mask
            align: TOP_MID
