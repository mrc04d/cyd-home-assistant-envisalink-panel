# =========================
# HOOK SCRIPTS
# =========================
script:
  # Hook implementations (see contract in alarm-core.yaml)
  - id: fx_buzzer
    parameters:
      duration_ms: int
    then:
      - switch.turn_on: buzzer
      - delay: !lambda 'return std::max(duration_ms, 1);'
      - switch.turn_off: buzzer
  - id: fx_alarm_visual
    parameters:
      active: bool
    then:
      # 2.8" latches the buzzer while triggered (parity with old behaviour)
      - if:
          condition:
            lambda: 'return active;'
          then:
            - switch.turn_on: buzzer
          else:
            - switch.turn_off: buzzer
