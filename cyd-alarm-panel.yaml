substitutions:
  device_name: cyd-alarm
  friendly_name: "CYD Alarm Panel"
  # Change this to your alarm entity ID
  alarm_entity: "alarm_control_panel.home_alarm_partition_1"
  # Grace period in milliseconds (10 seconds = 10000)
  grace_period_ms: "10000"
  # Change this to your timezone - examples:
  # Etc/UTC, America/New_York, Europe/London, Asia/Tokyo
  # Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Etc/UTC"

packages:
  core: !include common/alarm-core.yaml

esphome:
  name: ${device_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# =============================================================================
# WiFi Configuration
# =============================================================================
# Shared WiFi/AP configuration lives in common/alarm-core.yaml.
wifi:
  # OPTIONAL STATIC IP - device-local opt-in only (never enable in core):
  # manual_ip:
  #   static_ip: 192.168.1.70
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

# =========================
# HARDWARE
# =========================
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000

  - platform: ledc
    pin: GPIO26
    id: buzzer_pwm
    frequency: 2700

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

switch:
  - platform: output
    id: buzzer
    output: buzzer_pwm

# =========================
# SENSORS
# =========================
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 10s

# =========================
# SPI + Display + Touch
# =========================
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    model: ILI9341
    id: my_display
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    auto_clear_enabled: false
    invert_colors: false
    color_order: bgr
    rotation: 0
    dimensions:
      width: 320
      height: 240

touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    spi_id: touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    calibration:
      x_min: 435
      x_max: 3835
      y_min: 225
      y_max: 3635
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    on_touch:
      - lambda: id(last_touch) = millis();
      - light.turn_on:
          id: backlight
          brightness: 1.0
          transition_length: 300ms

# =========================
# LVGL UI
# =========================
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 25%

  pages:
    # ---- WIFI SETUP PAGE ----
    - id: wifi_setup_page
      bg_color: ${bg_dark}
      widgets:
        - obj:
            align: TOP_MID
            width: 320
            height: 40
            bg_color: ${card_bg}
            radius: 0
            border_width: 0

        - label:
            align: TOP_MID
            y: 10
            text: "WiFi Setup Required"
            text_color: 0xFF6600
            text_font: montserrat_22

        - obj:
            align: CENTER
            y: 10
            width: 300
            height: 150
            bg_color: ${card_bg}
            radius: 12
            border_width: 2
            border_color: 0xFF6600

        - label:
            align: CENTER
            y: -30
            text: "1. Connect to WiFi network:"
            text_color: ${text_dim}

        - label:
            id: ap_ssid_label
            align: CENTER
            y: -8
            text: "${friendly_name} Setup"
            text_color: ${button_green}
            text_font: montserrat_18

        - label:
            align: CENTER
            y: 18
            text: "2. Password: configme123"
            text_color: ${text_dim}

        - label:
            align: CENTER
            y: 45
            text: "3. Configure your WiFi"
            text_color: ${text_dim}

        - label:
            align: CENTER
            y: 68
            text: "in the portal that opens"
            text_color: ${text_dim}

        - label:
            align: BOTTOM_MID
            y: -15
            text: "Waiting for connection..."
            text_color: ${button_grey}

    # ---- MAIN PAGE ----
    - id: main_page
      bg_color: ${bg_dark}
      widgets:
        - obj:
            align: TOP_MID
            width: 320
            height: 32
            bg_color: ${card_bg}
            radius: 0
            border_width: 0

        - label:
            id: time_label
